<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="stylesheet" href="./assets/css/style.css">
    <title>todo crud-5</title>
</head>

<body>
    <div class="container mt-3">
        <h2 class="text-white text-center">--TODO-CRUD-5--</h2>
        <div class="row">
            <div class="col-md-4">
                <div class="card ">
                    <div class="card-body">
                        <form id="todoform">
                            <div class="form-group">
                                <label for="todoInput">ENTER YOUR TODO...!</label>
                                <input type="text" class="form-control" id="todoInput" required placeholder="">
                            </div>
                            <button id="addTodoBtn" class="btn btn-primary btn-sm btn-block">Add todo</button>
                            <button type="button" id="updateTodoBtn" class="btn btn-danger btn-sm btn-block">Update
                                todo</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <ul class="list-group" id="todoConatiner">
                            <!-- <li class="list-group-item d-flex justify-content-between align-items-center">
                                <strong>
                                    <h1>html</h1>
                                </strong>
                            <div>
                                <i class="fa-regular fa-pen-to-square fa-2x text-primary"></i>
                                <i class="fa-solid fa-trash fa-2x text-danger"></i>
                            </div>
                            </li> -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <div class="spinner d-none" id="spinner">
            <div class="spinner-border text-primary" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
        <script src="./assets/js/app.js"></script>
</body>

</html>
